config:
  target: "{{ $processEnvironment.API_HOST }}/accounts"
  plugins:
    expect: {}
  payload:
    path: "testFetchNonExistentSession.csv"
    skipHeader: true
    fields:
      - "account_id"
      - "event_code"
    delimiter: "^|^"

scenarios:
  - scenario:
      name: "testFetchNonExistentSession"
      flow:
        - log: "Fetching non-existent session with ID R64EKX5RG32U"
        - get:
            url: "/{{ account_id }}/events/{{ event_code }}/sessions/instanceList"
            headers:
              Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
        - think: 1
        - log: "Expecting 404 Not Found response"
        - expect:
            - statusCode: 404
            - hasProperty: "error"
            - hasProperty: "message"
