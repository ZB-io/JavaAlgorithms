config:
  target: "{{ $processEnvironment.API_HOST }}/accounts/{{account_id}}/events/{{event_code}}"
  plugins:
    expect: {}
  payload:
    path: "testUpdateLocationCapacity.csv"
    fields:
      - "location_id"
      - "capacity"
    delimiter: "^|^"
    skipHeader: true

scenarios:
  - scenario: testUpdateLocationCapacity
    flow:
      - log: "Updating capacity for location UCLocation-HBER8FXU0J to 20"
      - post:
          url: "/locations"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            location_id: "UCLocation-HBER8FXU0J"
            capacity: 20
          expect:
            - statusCode: 200
            - hasProperty: "location_id"
            - hasProperty: "capacity"
            - hasProperty: "message"
            - equals:
                - "{{ message }}"
                - "Location capacity updated successfully"
      - think: 2
      - log: "Retrieving updated location details for location UCLocation-HBER8FXU0J"
      - get:
          url: "/locations?location_id=UCLocation-HBER8FXU0J"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "location_id"
            - hasProperty: "capacity"
            - equals:
                - "{{ location_id }}"
                - "UCLocation-HBER8FXU0J"
            - equals:
